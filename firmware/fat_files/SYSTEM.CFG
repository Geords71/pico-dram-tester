# Controls the pico's LED state.
led_on=false

# If your encoder is skipping lines, try setting this to four.
enc_states_per_click=2

# Dictates how many pseudo test loops. 64 is slower but more rigorous.
tests_psuedo_values=32

# Show info on which socket and what orientation. Experienced users may want to
# avoid this nag.
show_socket_prompt=true

# You can turn this off if you are not supplying chip power via the power pins.
show_power_prompt=true